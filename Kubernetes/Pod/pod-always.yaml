apiVersion: v1
kind: Pod
metadata:
  name: multi
spec:
  restartPolicy: Always # applies to ALL app containers in this Pod
  containers:
    - name: app # hello-spring
      image: hello-spring:1.0
    - name: log-shipper
      image: busybox
      command: ["sh", "-c", "tail -f /dev/null"]
    - name: metrics
      image: busybox
      command: ["sh", "-c", "sleep 3600"]

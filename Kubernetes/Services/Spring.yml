apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-spring # Deployment name
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-spring
  template:
    metadata:
      labels:
        app: hello-spring
    spec:
      containers:
        - name: app
          image: hello-spring:2.0
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30 # 30 x 5s = up to 150s to boot
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3 # 3 failures in a row restarts the container
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hello-spring-svc # Service name and DNS name
spec:
  type: ClusterIP
  selector:
    app: hello-spring
  ports:
    - port: 80
      targetPort: 8080

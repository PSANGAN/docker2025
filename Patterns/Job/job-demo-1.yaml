apiVersion: batch/v1
kind: Job
metadata: { name: fail-job }
spec:
  completions: 5 # total successful Pods needed
  parallelism: 2 # how many run at once
  backoffLimit: 2 # retries before the Job is marked Failed
  ttlSecondsAfterFinished: 300 # auto-cleanup 5 minutes after finishing
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]

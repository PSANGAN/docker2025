apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - {
            name: redis,
            image: "redis:7-alpine",
            ports: [{ containerPort: 6379 }],
          }
---
apiVersion: v1
kind: Service
metadata: { name: redis-svc }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: v1
kind: Pod
metadata: { name: app-with-ambassador }
spec:
  containers:
    - name: app # only knows "localhost"
      image: redis:7-alpine # used for the redis-cli client
      command: ["sh", "-c", "sleep 3600"]
    - name: ambassador # proxy to the real Redis
      image: alpine/socat
      args: ["TCP-LISTEN:6379,fork,reuseaddr", "TCP:redis-svc:6379"]
